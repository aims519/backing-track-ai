version: 2
updates:
  - package-ecosystem: nuget
    directory: "/api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      # OpenAI rides with the agent framework: Microsoft.Agents.AI.OpenAI is compiled against a
      # specific OpenAI SDK, and bumping the SDK alone breaks at runtime (TypeLoadException, #85).
      agent-framework:
        patterns:
          - "Microsoft.Agents.AI*"
          - "OpenAI"
      xunit:
        patterns:
          - "xunit*"
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "Moq"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
