name: API CI

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/verify.yml"
      - "global.json"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/verify.yml"
      - "global.json"
      - "scripts/**"

# One in-flight run per ref; a newer push to a PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
