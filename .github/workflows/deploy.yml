name: Deploy API to Pi

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"

env:
  PUBLISH_DIR: publish
  RELEASE_PATH: /opt/backingtrack/releases/${{ github.sha }}
  CURRENT_PATH: /opt/backingtrack/current
  SERVICE_NAME: backingtrack-api.service
  # Newest releases kept on the Pi after a successful deploy. Each main push adds one, and
  # the Pi's SSD is small. Five leaves headroom to roll back by hand past the automatic one.
  KEEP_RELEASES: 5

jobs:
  # Same build/test/format/AOT gate CI runs, re-run here against the exact SHA
  # being deployed. No deploy step starts unless this passes.
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    # Same self-hosted + docker-exec approach as verify.yml (GitHub's `container:` key
    # isn't supported on macOS runners). The self-hosted Mac is Apple Silicon, so
    # linux/arm64 is a *native* container target here, matching the Pi — no arm64
    # cross toolchain or ObjCopyName override needed, unlike the old x64
    # GitHub-hosted runner this replaced.
    runs-on: [self-hosted, macOS]
    env:
      CI_CONTAINER: publish-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from tags and commit height; a shallow clone has neither.
          fetch-depth: 0

      - name: Start Linux build container
        run: |
          docker run -d --name "$CI_CONTAINER" \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            mcr.microsoft.com/dotnet/sdk:10.0 sleep infinity

      - name: Trust workspace for MinVer
        # The bind-mounted checkout is owned by a different uid than the container user, which
        # makes git refuse to read it ("dubious ownership") and MinVer with it.
        run: docker exec "$CI_CONTAINER" git config --global --add safe.directory /workspace

      - name: Install AOT prerequisites
        run: docker exec "$CI_CONTAINER" bash -c "apt-get update && apt-get install -y clang"

      - name: Publish Native AOT (linux-arm64)
        # MinVer sets the version from the nearest api-v* tag; SourceRevisionId pins the +<sha>
        # suffix to the exact commit rather than relying on the SDK finding .git in the container.
        # BuildInfo reports the result as OpenTelemetry service.version.
        run: |
          docker exec "$CI_CONTAINER" dotnet publish api/src/BackingTrack.Api \
            -c Release \
            -r linux-arm64 \
            -p:PublishAot=true \
            -p:SourceRevisionId=${{ github.sha }} \
            --self-contained \
            -o "/workspace/$PUBLISH_DIR"

      - name: Stop Linux build container
        if: always()
        run: docker rm -f "$CI_CONTAINER" || true

      - name: Upload publish output
        uses: actions/upload-artifact@v7
        with:
          name: api-publish-${{ github.sha }}
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 1

  deploy:
    needs: publish
    # Runs directly on the Mac host (not the ubuntu container publish used): SSH/curl
    # here don't care what OS they're running on. No Tailscale connect step needed —
    # unlike the old ephemeral GitHub-hosted runner, this Mac is itself a persistent
    # tailnet node (see the launchd-installed self-hosted runner setup), so it can
    # already reach the Pi directly.
    runs-on: [self-hosted, macOS]
    steps:
      # Only for scripts/prune-releases.sh; the build itself comes from the publish artifact.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Download publish output
        uses: actions/download-artifact@v8
        with:
          name: api-publish-${{ github.sha }}
          path: ${{ env.PUBLISH_DIR }}

      - name: Write deploy key
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > /tmp/deploy_key

      - name: Wait for Pi SSH and record host key
        run: |
          mkdir -p ~/.ssh
          for i in 1 2 3; do
            ssh-keyscan -H "${{ vars.PI_TAILSCALE_IP }}" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 2
          done

      - name: Copy release to Pi
        run: |
          ssh -i /tmp/deploy_key "ci-deploy@${{ vars.PI_TAILSCALE_IP }}" \
            "mkdir -p '$RELEASE_PATH' && chmod 755 '$RELEASE_PATH'"
          scp -i /tmp/deploy_key -r "./$PUBLISH_DIR/." \
            "ci-deploy@${{ vars.PI_TAILSCALE_IP }}:$RELEASE_PATH/"

      - name: Record current release for rollback
        id: previous
        # Empty on the very first deploy (no symlink yet), which disables rollback below.
        run: |
          previous=$(ssh -i /tmp/deploy_key "ci-deploy@${{ vars.PI_TAILSCALE_IP }}" \
            "readlink '$CURRENT_PATH' || true")
          echo "Current release before swap: ${previous:-<none>}"
          echo "path=$previous" >> "$GITHUB_OUTPUT"

      - name: Swap release and restart service
        run: |
          ssh -i /tmp/deploy_key "ci-deploy@${{ vars.PI_TAILSCALE_IP }}" \
            "chmod +x '$RELEASE_PATH/BackingTrack.Api' && \
             ln -sfn '$RELEASE_PATH' '$CURRENT_PATH' && \
             sudo systemctl restart '$SERVICE_NAME'"

      - name: Liveness check
        run: |
          for i in $(seq 1 10); do
            if curl -sf "http://${{ vars.PI_TAILSCALE_IP }}:5080/healthz/live"; then
              exit 0
            fi
            sleep 2
          done
          echo "Liveness check failed after deploy" >&2
          exit 1

      - name: Readiness check
        run: |
          for i in $(seq 1 10); do
            # TEMPORARY: deliberately wrong path to prove the rollback. Revert this commit.
            if curl -sf "http://${{ vars.PI_TAILSCALE_IP }}:5080/healthz/ready-ROLLBACK-TEST"; then
              exit 0
            fi
            sleep 2
          done
          echo "Readiness check failed after deploy" >&2
          exit 1

      # Keyed on failure() rather than on one specific check, so a failed swap/restart, liveness
      # or readiness (whatever #123 makes readiness mean) all roll back. The failed step has
      # already marked the job red; this step only restores service and never turns it green.
      # The failed release stays on disk for inspection until a later deploy prunes it.
      - name: Roll back to previous release
        if: failure() && steps.previous.outputs.path != ''
        env:
          PREVIOUS_RELEASE: ${{ steps.previous.outputs.path }}
        run: |
          echo "Deploy of ${{ github.sha }} failed; rolling back to $PREVIOUS_RELEASE" >&2
          ssh -i /tmp/deploy_key "ci-deploy@${{ vars.PI_TAILSCALE_IP }}" \
            "test -d '$PREVIOUS_RELEASE' && \
             ln -sfn '$PREVIOUS_RELEASE' '$CURRENT_PATH' && \
             sudo systemctl restart '$SERVICE_NAME'"
          for i in $(seq 1 10); do
            if curl -sf "http://${{ vars.PI_TAILSCALE_IP }}:5080/healthz/live"; then
              echo "Rolled back; previous release is live again"
              exit 0
            fi
            sleep 2
          done
          echo "Rollback did not come back live; manual intervention needed" >&2
          exit 1

      - name: Prune old releases
        # Only after checks pass, so a failed deploy never deletes the release it fell back to.
        # Newest by mtime wins; whatever `current` points at is always kept regardless.
        # The script is piped over SSH, so nothing needs installing on the Pi.
        run: |
          ssh -i /tmp/deploy_key "ci-deploy@${{ vars.PI_TAILSCALE_IP }}" \
            bash -s -- "$KEEP_RELEASES" "$(dirname "$RELEASE_PATH")" "$CURRENT_PATH" \
            < scripts/prune-releases.sh

      - name: Clean up deploy key
        if: always()
        run: rm -f /tmp/deploy_key
