name: iOS CI

# Build/test gate for app/. Kept as a separate workflow from api-ci.yml (the api/ pipeline)
# since it needs a macOS runner. Path-filtered so it only runs when app/ actually changes.

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ios-ci.yml"
  # Pushes to main run this via ios-release.yml instead (the same pattern as deploy.yml calling
  # verify.yml), so the exact SHA is tested before it's archived for TestFlight. There's no
  # separate `push` trigger: it would test the same SHA twice, and both runs would share the
  # concurrency group below, so each could cancel the other.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    env:
      # Pinned because the image's default Xcode moves on GitHub's schedule, and the simulator
      # OS in the destinations below has to exist in the Xcode that's selected.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app

    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create local signing config
        # project.yml's configFiles points at Config/Local.xcconfig for DEVELOPMENT_TEAM —
        # gitignored since a team ID is tied to a personal Apple account, not the project (see
        # app/README.md). xcodegen generate fails outright without this file existing, but the
        # placeholder team ID from the committed .example is fine here: the Build/Test steps
        # below override signing entirely with CODE_SIGN_IDENTITY="-", which never reads it.
        run: cp app/Config/Local.xcconfig.example app/Config/Local.xcconfig

      - name: Generate Xcode project
        run: cd app && xcodegen generate

      - name: List available simulators
        # Useful for debugging a destination-not-found failure without re-running the
        # whole job — shows exactly what this runner image has installed.
        run: xcrun simctl list devices available

      - name: Build
        # CODE_SIGN_IDENTITY="-" is the ad-hoc "Sign to Run Locally" identity — works on any
        # Mac with no Apple Developer account or certificate needed, unlike a real signing
        # identity. Deliberately *not* CODE_SIGNING_ALLOWED=NO: an unsigned binary has no
        # app-identifier entitlement, and Keychain access (see APIKeyStoreTests) needs one even
        # in the Simulator — that gap only surfaces at test-run time, not at build time.
        #
        # OS pinned explicitly rather than left as the implicit OS:latest, so a new runtime on the
        # image can't change which simulator is picked. The macos-26 image has no iPhone 16
        # simulator at all (iPhone 17 and later only) — check `xcrun simctl list devices
        # available` in the step above before changing the device name or OS.
        run: >
          xcodebuild -project app/BackingTrack.xcodeproj -scheme BackingTrack
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO build

      - name: Test
        run: >
          xcodebuild -project app/BackingTrack.xcodeproj -scheme BackingTrack
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO test
