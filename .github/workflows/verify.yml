name: Verify

# Reusable build/test/format/AOT gate. Called by api-ci.yml (on PRs and pushes to main)
# and by deploy.yml (as a prerequisite of the deploy job, so the exact SHA that ships
# to the Pi has been verified).

on:
  workflow_call:

jobs:
  verify:
    # arm64 so the AOT check below builds for the same architecture the Pi runs (ADR 0050).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from tags and commit height; a shallow clone has neither.
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install AOT prerequisites
        # check-aot.sh publishes for the host RID, so it needs only the native linker
        # (clang) — not a cross toolchain. zlib1g-dev is already on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Restore
        run: dotnet restore api/BackingTrack.sln

      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors + EnforceCodeStyleInBuild,
        # so analyzer and code-style violations fail here.
        run: dotnet build api/BackingTrack.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test --solution api/BackingTrack.sln -c Release --no-build
          --report-trx --coverage --coverage-output-format cobertura
          --results-directory "$GITHUB_WORKSPACE/TestResults"

      - name: Coverage report
        if: always()
        # Collector emits one XML file per project, e.g. /TestResults/<guid>.cobertura.xml.
        # The report generator merges them and creates a summary.
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"$GITHUB_WORKSPACE/TestResults/*.cobertura.xml" \
            -targetdir:"$GITHUB_WORKSPACE/TestResults/CoverageReport" \
            -reporttypes:"MarkdownSummaryGithub;HtmlInline_AzurePipelines"
          cat "$GITHUB_WORKSPACE/TestResults/CoverageReport/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ${{ github.workspace }}/TestResults/*.trx
            ${{ github.workspace }}/TestResults/*.cobertura.xml
            ${{ github.workspace }}/TestResults/CoverageReport
          if-no-files-found: error
          # Default is 90 days; at ~6 MB a run that exhausted the private repo's artifact quota.
          retention-days: 7

      - name: Format check
        # Whitespace only — style and analyzer rules are already build errors here
        # (EnforceCodeStyleInBuild + TreatWarningsAsErrors), and AOT is covered by
        # the publish check below. `dotnet build` never inspects whitespace.
        run: dotnet format whitespace api/BackingTrack.sln --verify-no-changes --no-restore

      - name: Native AOT publish check
        # No explicit RID: auto-detects the runner's host RID (linux-arm64).
        run: scripts/check-aot.sh
