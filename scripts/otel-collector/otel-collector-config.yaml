receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch: {}

extensions:
  basicauth/grafanacloud:
    client_auth:
      username: "1745886"
      password: "${env:GRAFANA_API_TOKEN}"

exporters:
  otlphttp/grafanacloud:
    endpoint: https://otlp-gateway-prod-gb-south-1.grafana.net/otlp
    auth:
      authenticator: basicauth/grafanacloud

service:
  extensions: [basicauth/grafanacloud]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafanacloud]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafanacloud]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafanacloud]
