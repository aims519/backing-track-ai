receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch: {}

extensions:
  basicauth/grafanacloud:
    client_auth:
      username: "1745886"
      password: "${env:GRAFANA_API_TOKEN}"
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/healthz/status"
    response_body:
      healthy: Healthy
      unhealthy: Unhealthy

exporters:
  otlphttp/grafanacloud:
    endpoint: https://otlp-gateway-prod-gb-south-1.grafana.net/otlp
    auth:
      authenticator: basicauth/grafanacloud

service:
  extensions: [basicauth/grafanacloud, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafanacloud]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafanacloud]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafanacloud]