# XcodeGen project spec — the .xcodeproj itself is generated from this file (and gitignored),
# rather than committed and hand-edited. Regenerate after changing this file, or after
# adding/removing/moving source files, with:
#
#   xcodegen generate
#
# See README.md for setup instructions.

name: BackingTrack
options:
  bundleIdPrefix: com.andrewsavory
  # iOS 18 is the previous major release relative to the current iOS 26 (Apple's 2025
  # platform-wide renumbering jumped straight from 18 to 26 to align version numbers across
  # iOS/macOS/watchOS/etc. by year — there's no 19-25). As of 2026-08-30, Apple's published
  # adoption figures (developer.apple.com/support/app-store/) put 79% of devices on iOS 26 and
  # 14% on iOS 18, so an 18 floor covers ~93% of devices — the usual "N-1" production floor.
  # Not actually a distribution constraint for this app (single device, no App Store — see
  # docs/backing-track-generator-scope.md), just a sensible default that costs nothing here.
  deploymentTarget:
    iOS: "18.0"
  # Nests file groups in Xcode's navigator to mirror the folder structure on disk, instead of
  # flattening everything under the target group.
  createIntermediateGroups: true

# Applies Config/Local.xcconfig's project-level build settings (currently just DEVELOPMENT_TEAM)
# to both configs. That file is gitignored and machine-specific — see Config/Local.xcconfig.example
# and README.md — because a team ID is tied to an Apple ID, not the project. XcodeGen errors out
# if the referenced file doesn't exist, which is the point: it forces the one-time local setup
# step rather than silently building unsigned.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig



settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift's full concurrency checking, on by default for new targets in recent Xcode —
    # catches data races (e.g. touching UI state off the main actor) at compile time.
    SWIFT_STRICT_CONCURRENCY: complete
    # These three picked up from Xcode's "Update to recommended settings" prompt — set here
    # rather than through Xcode's UI, since XcodeGen regenerates the .xcodeproj and would
    # silently discard a change made directly to it.
    #
    # Restricts Run Script build phases to their declared inputs/outputs for reproducible
    # builds. We have no Run Script phases yet; harmless either way.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Generates type-safe Swift accessors for strings in a String Catalog (.xcstrings) file.
    # Inert until we add one — no localization work has started yet.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Beyond the ImageResource/ColorResource symbols Xcode always generates for asset catalog
    # entries, this also generates extensions directly on SwiftUI's Image/Color (and
    # UIKit/AppKit's UIImage/UIColor etc.) — e.g. `Image(.guitars)` instead of needing to know
    # the underlying resource type name.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  BackingTrack:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BackingTrack
        excludes:
          - "**/.gitkeep"
          # Referenced by INFOPLIST_FILE below, not a bundled resource — keep it out of the
          # Copy Bundle Resources phase.
          - "Info.plist"
    # Push capability for job-completion notifications (ADR 0039). "development" targets the
    # APNs sandbox; archiving for TestFlight/App Store re-signs it as "production".
    entitlements:
      path: BackingTrack/BackingTrack.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewsavory.backingtrack
        PRODUCT_NAME: BackingTrack
        # Bump MARKETING_VERSION by commit when a change deserves a new version number; every
        # push to main uploads it to TestFlight. CURRENT_PROJECT_VERSION is for local builds only:
        # ios-release.yml overrides it with the workflow run number (ADR 0040).
        MARKETING_VERSION: "0.7.2"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for MVP — see docs/backing-track-generator-scope.md
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Modern Xcode generates Info.plist from build settings instead of a committed file —
        # one less file to keep in sync by hand. INFOPLIST_KEY_* below become plist entries.
        # The partial BackingTrack/Info.plist is merged on top of the generated one (it carries
        # only UILaunchScreen — a nested dict with no INFOPLIST_KEY_* equivalent).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: BackingTrack/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: BackingTrack
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Declares up front that the app uses no non-exempt encryption (only what iOS provides;
        # the API is plain HTTP inside Tailscale, ADR 0022). Without it, every uploaded build
        # sits at "Missing Compliance" in App Store Connect until the question is answered by
        # hand, which also blocks automatic distribution to the TestFlight group.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Seconds between polls of GET /tracks/status on the generation progress screen. Surfaced
        # as the StatusPollInterval Info.plist key (see BackingTrack/Info.plist), read by
        # PollingConfiguration. Set in `base` so Release is covered without a Config/Local.xcconfig
        # entry (unlike API_BASE_URL, a poll cadence has no per-machine reason to differ); Debug
        # overrides it below for tighter local iteration.
        STATUS_POLL_INTERVAL: "1"
      configs:
        # Base URL of the backing-track API. Surfaced to the app as the APIBaseURL Info.plist key
        # (see BackingTrack/Info.plist) and read at launch by APIConfiguration.
        #
        # Debug gets the local `dotnet run` address baked in here so the simulator works with no
        # per-machine setup. The `//` is safe: this becomes a pbxproj build setting, not an
        # xcconfig line (where `//` starts a comment — see Config/Local.xcconfig.example).
        #
        # Release is deliberately left unset here so the machine-local Config/Local.xcconfig
        # supplies the Pi's Tailscale URL — same pattern as DEVELOPMENT_TEAM. A Release build with
        # no value set fails fast at launch (APIConfiguration).
        Debug:
          API_BASE_URL: http://localhost:5198
          STATUS_POLL_INTERVAL: "1" # snappier feedback iterating against a local API

  BackingTrackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BackingTrackTests
    dependencies:
      - target: BackingTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Test bundles get signed too when run on a device (they're loaded into the host app's
        # process) — same automatic-signing rationale as the BackingTrack target above.
        CODE_SIGN_STYLE: Automatic

schemes:
  BackingTrack:
    build:
      targets:
        BackingTrack: all
        BackingTrackTests: [test]
    test:
      targets:
        - BackingTrackTests
    run:
      config: Debug
