# Local-dev OTel Collector config — used by the docker-compose stack in this
# directory. Binds 0.0.0.0 (container networking) and exports to the local
# grafana-lgtm container plus a debug exporter.
# The production config that runs on the Pi (loopback-only, exports to Grafana
# Cloud) is scripts/otel-collector/otel-collector-config.yaml.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/grafana:
    endpoint: grafana-lgtm:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/grafana, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/grafana, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/grafana, debug]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/healthz/status"
    response_body:
      healthy: Healthy
      unhealthy: Unhealthy
