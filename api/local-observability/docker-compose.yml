services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # Health check extension
    depends_on:
      - grafana-lgtm

  grafana-lgtm:
    image: grafana/otel-lgtm:0.30.0
    ports:
      - "3000:3000" # Grafana UI
    volumes:
      - ./dashboards:/backing-track-dashboards:ro
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/backing-track.yaml:ro
