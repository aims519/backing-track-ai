title = "backing-track-ai gitleaks config"

[extend]
useDefault = true

# Former APNs device token test fixture. The tests now use an obviously fake
# token, but this value is still in git history (#89, #119) and `gitleaks git`
# scans history. A device token only identifies a device (pushing also needs
# the APNs auth key), so allowlist the exact value rather than paths or rules.
[[allowlists]]
description = "APNs device token test fixture"
regexTarget = "match"
regexes = ['''b76252068fdfa84cf6b03d46495b43f7599b05a82e0c079b0d24ed52ca6d96ba''']
